<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f2a4a">
    <title>HSC ২০২৬ ফলাফল পোর্টাল</title>

    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <!-- গুগল ফন্ট -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --navy: #0f2a4a;
            --navy-2: #173a63;
            --bg: #eef1f5;
            --surface: #ffffff;
            --ink: #14202e;
            --muted: #5b6b7c;
            --line: #d9e0e8;
            --field: #f6f8fb;
            --pass: #0b7a5a;
            --pass-bg: #e8f5f0;
            --fail: #b42318;
            --fail-bg: #fdecea;
            --warn: #9a6200;
            --warn-bg: #fff4de;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            font-family: 'Hind Siliguri', system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.5;
        }

        /* ---------- হেডার ---------- */
        .site-header {
            background: var(--navy);
            color: #fff;
            border-bottom: 3px solid #c9a227;
        }

        .site-header-inner {
            max-width: 520px;
            margin: 0 auto;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .site-header svg { flex: none; }

        .site-header .t1 {
            font-size: 17px;
            font-weight: 600;
            line-height: 1.25;
        }

        .site-header .t2 {
            font-size: 13px;
            font-weight: 400;
            color: #b9c7d8;
        }

        /* ---------- মূল অংশ ---------- */
        main {
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
            padding: 24px 16px 40px;
            flex: 1;
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 10px;
            box-shadow: 0 1px 2px rgba(15, 42, 74, 0.06);
        }

        .search-panel { padding: 24px 20px 22px; }

        .search-panel h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--navy);
            line-height: 1.3;
        }

        .search-panel .lead {
            margin-top: 4px;
            font-size: 15px;
            color: var(--muted);
        }

        .field { margin-top: 22px; }

        .field label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .input-wrap { position: relative; }

        .input-wrap svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            pointer-events: none;
        }

        input[type="text"] {
            width: 100%;
            height: 54px;
            padding: 0 16px 0 46px;
            font-family: inherit;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 3px;
            color: var(--ink);
            background: var(--field);
            border: 1.5px solid var(--line);
            border-radius: 8px;
            outline: none;
            transition: border-color .15s, box-shadow .15s, background-color .15s;
        }

        input[type="text"]::placeholder {
            font-size: 16px;
            font-weight: 400;
            letter-spacing: 0;
            color: #93a1b1;
        }

        input[type="text"]:focus {
            background: #fff;
            border-color: var(--navy-2);
            box-shadow: 0 0 0 3px rgba(23, 58, 99, 0.18);
        }

        .hint {
            margin-top: 8px;
            font-size: 13px;
            color: var(--muted);
        }

        .search-btn {
            margin-top: 18px;
            width: 100%;
            height: 52px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            background: var(--navy);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background-color .15s, transform .1s;
        }

        .search-btn:hover:not(:disabled) { background: var(--navy-2); }
        .search-btn:active:not(:disabled) { transform: scale(0.99); }
        .search-btn:disabled { background: #8a97a8; cursor: not-allowed; }

        .search-btn:focus-visible,
        .info-link:focus-visible {
            outline: 3px solid #c9a227;
            outline-offset: 2px;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2.5px solid rgba(255, 255, 255, 0.35);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .info-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 18px;
            font-size: 14px;
            font-weight: 500;
            color: var(--navy-2);
            text-decoration: none;
            border-bottom: 1px solid transparent;
        }
        .info-link:hover { border-bottom-color: var(--navy-2); }

        /* ---------- এরর ---------- */
        .error-box {
            display: none;
            margin-top: 16px;
            padding: 12px 14px;
            font-size: 14px;
            font-weight: 500;
            color: var(--fail);
            background: var(--fail-bg);
            border: 1px solid #f3c1bb;
            border-left: 4px solid var(--fail);
            border-radius: 6px;
            align-items: flex-start;
            gap: 10px;
        }
        .error-box.show-error { display: flex; }
        .error-box svg { flex: none; margin-top: 2px; }

        /* ---------- ফলাফল (মার্কশিট স্টাইল) ---------- */
        .result-panel {
            display: none;
            margin-top: 16px;
            overflow: hidden;
        }

        .result-panel.show { display: block; animation: reveal .3s ease-out both; }

        @keyframes reveal {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: none; }
        }

        .result-head {
            padding: 14px 20px;
            background: var(--field);
            border-bottom: 1px solid var(--line);
            font-size: 15px;
            font-weight: 600;
            color: var(--navy);
        }

        .result-head small {
            display: block;
            font-size: 12.5px;
            font-weight: 400;
            color: var(--muted);
        }

        .rows { padding: 4px 20px; }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 16px;
            padding: 13px 0;
            border-bottom: 1px solid var(--line);
            font-size: 15px;
        }

        .row .k { color: var(--muted); flex: none; }
        .row .v { font-weight: 600; text-align: right; }

        .verdict {
            margin: 16px 20px 20px;
            padding: 16px;
            border-radius: 8px;
            text-align: center;
        }

        .verdict.pass { background: var(--pass-bg); border: 1px solid #b7e0d2; }
        .verdict.fail { background: var(--fail-bg); border: 1px solid #f3c1bb; }
        .verdict.warn { background: var(--warn-bg); border: 1px solid #f0d8a3; }

        .verdict .label {
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .verdict.pass .label, .verdict.pass .big { color: var(--pass); }
        .verdict.fail .label, .verdict.fail .big { color: var(--fail); }
        .verdict.warn .label, .verdict.warn .big { color: var(--warn); }

        .verdict .big {
            margin-top: 4px;
            font-size: 40px;
            font-weight: 700;
            line-height: 1.15;
        }

        .verdict .big.text { font-size: 26px; }

        .verdict .sub {
            margin-top: 2px;
            font-size: 13px;
            color: var(--muted);
        }

        /* ---------- ফুটার ---------- */
        footer {
            padding: 16px 20px 24px;
            text-align: center;
            font-size: 12.5px;
            color: var(--muted);
        }

        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>

    <header class="site-header">
        <div class="site-header-inner">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#c9a227" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 9l10-5 10 5-10 5-10-5z"/>
                <path d="M6 11.5V16c0 1.4 2.7 3 6 3s6-1.6 6-3v-4.5"/>
                <path d="M22 9v6"/>
            </svg>
            <div>
                <div class="t1">উচ্চ মাধ্যমিক সার্টিফিকেট পরীক্ষা ২০২৬</div>
                <div class="t2">ফলাফল পোর্টাল</div>
            </div>
        </div>
    </header>

    <main>
        <section class="panel search-panel">
            <h1>ফলাফল অনুসন্ধান</h1>
            <p class="lead">রোল নম্বর দিয়ে আপনার ফলাফল দেখুন।</p>

            <div class="field">
                <label for="rollInput">রোল নম্বর</label>
                <div class="input-wrap">
                    <input type="text" id="rollInput" placeholder="যেমন: 120145" maxlength="6" inputmode="numeric" autocomplete="off" autofocus
                           oninput="normalizeRoll(this)"
                           onkeypress="if(event.key === 'Enter') checkResult()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="5" width="18" height="14" rx="2"/>
                        <circle cx="9" cy="11" r="2"/>
                        <path d="M6 16c.6-1.4 1.8-2 3-2s2.4.6 3 2M15 10h3M15 14h3"/>
                    </svg>
                </div>
                <p class="hint">৬ সংখ্যার রোল নম্বর দিন।</p>
            </div>

            <button class="search-btn" id="searchBtn" onclick="checkResult()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
                ফলাফল দেখুন
            </button>

            <div id="errorBox" class="error-box" role="alert"></div>

            <a href="info.html" class="info-link">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
                কোন কোন কলেজের ফলাফল পাওয়া যাবে?
            </a>
        </section>

        <!-- ফলাফল -->
        <section id="resultBox" class="panel result-panel" aria-live="polite">
            <div class="result-head">
                <small>প্রতিষ্ঠান</small>
                <span id="collegeName"></span>
            </div>
            <div class="rows">
                <div class="row">
                    <span class="k">রোল নম্বর</span>
                    <span class="v" id="rollDisplay"></span>
                </div>
            </div>
            <div id="resultValue"></div>
        </section>
    </main>

    <footer>HSC ২০২৬ ফলাফল পোর্টাল</footer>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const COLLEGES = [
        { code: "128672", pdfName: "128672.pdf", name: "SALAP COLLEGE, ULLAPARA, SIRAJGANJ" },
        { code: "128673", pdfName: "128673.pdf", name: "PRINCIPAL ABUL HOSSAIN COLLEGE, ULLAPARA, SIRAJGANJ" },
        { code: "128674", pdfName: "128674.pdf", name: "ULLAPARA SCIENCE COLLEGE, ULLAPARA, SIRAJGANJ" },
        { code: "128675", pdfName: "128675.pdf", name: "H.T. IMAM DEGREE COLLEGE, ULLAPARA, SIRAJGANJ" },
        { code: "128676", pdfName: "128676.pdf", name: "AKBAR ALI GOVT. COLLEGE, ULLAPARA, SIRAJGANJ" }
    ];

    // বাংলা সংখ্যা (০-৯) ইংরেজিতে রূপান্তর + শুধু সংখ্যা রাখা
    function normalizeRoll(el) {
        const bn = '০১২৩৪৫৬৭৮৯';
        el.value = el.value
            .replace(/[০-৯]/g, d => bn.indexOf(d))
            .replace(/[^0-9]/g, '');
    }

    async function extractTextFromPdf(pdfUrl) {
        try {
            const loadingTask = pdfjsLib.getDocument(pdfUrl);
            const pdf = await loadingTask.promise;
            let fullText = "";
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                fullText += textContent.items.map(item => item.str).join(" ") + "\n";
            }
            return fullText;
        } catch (error) {
            return null;
        }
    }

    const ICON_ERR = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5h.01"/></svg>';
    const ICON_OK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.5"/></svg>';
    const ICON_NO = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>';
    const ICON_SEARCH = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>';

    function showError(msg) {
        const errorBox = document.getElementById('errorBox');
        errorBox.innerHTML = ICON_ERR + '<span>' + msg + '</span>';
        errorBox.classList.add('show-error');
    }

    async function checkResult() {
        const roll = document.getElementById('rollInput').value.trim();
        const resultBox = document.getElementById('resultBox');
        const errorBox = document.getElementById('errorBox');
        const searchBtn = document.getElementById('searchBtn');

        resultBox.classList.remove('show');
        errorBox.classList.remove('show-error');

        if (roll.length !== 6) {
            showError('সঠিক ৬ সংখ্যার রোল নম্বর দিন।');
            return;
        }

        searchBtn.disabled = true;
        searchBtn.innerHTML = '<div class="spinner"></div> অনুসন্ধান করা হচ্ছে...';

        let found = false;
        let resultData = null;

        for (let college of COLLEGES) {
            const text = await extractTextFromPdf(college.pdfName);
            if (!text) continue;

            const regex = new RegExp(roll + "\\s*\\[([^\\]]+)\\]");
            const match = text.match(regex);

            if (match) {
                found = true;
                resultData = { roll: roll, value: match[1].trim(), college: college.name };
                break;
            }
        }

        searchBtn.disabled = false;
        searchBtn.innerHTML = ICON_SEARCH + ' ফলাফল দেখুন';

        if (found && resultData) {
            document.getElementById('collegeName').innerText = resultData.college;
            document.getElementById('rollDisplay').innerText = resultData.roll;

            const value = resultData.value;
            const resultValueDiv = document.getElementById('resultValue');

            if (!isNaN(value)) {
                resultValueDiv.innerHTML = `
                    <div class="verdict pass">
                        <div class="label">${ICON_OK} উত্তীর্ণ</div>
                        <div class="big">GPA ${value}</div>
                    </div>`;
            } else {
                let statusText = value;
                let cls = 'fail';
                if (value === 'ABS.') { statusText = 'অনুপস্থিত (ABS.)'; cls = 'warn'; }
                if (value === 'FAIL') { statusText = 'অকৃতকার্য (FAIL)'; }
                resultValueDiv.innerHTML = `
                    <div class="verdict ${cls}">
                        <div class="label">${ICON_NO} জিপিএ প্রকাশিত হয়নি</div>
                        <div class="big text">${statusText}</div>
                    </div>`;
            }

            resultBox.classList.add('show');
            resultBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

        } else {
            showError('এই রোল নম্বরটি কোনো কলেজের ফলাফলে পাওয়া যায়নি। রোল নম্বর আবার দেখে নিন।');
        }
    }
</script>

</body>
</html>
